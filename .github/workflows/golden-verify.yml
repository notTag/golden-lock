name: golden-verify

# Defense-in-depth tamper gate. `golden-lock verify` recomputes the SHA-256 of
# every entry in golden-lock/golden.lock and compares it to the manifest. It needs NO
# privileges (reads only), so it runs here with zero sudo. If a golden test was
# edited without re-blessing it through the root-owned manifest, the hash drifts
# and verify exits non-zero -> this check fails -> the change cannot merge, even
# on a fresh clone where the local root-owned 0444 permissions were never applied.
#
# Make this a required status check (branch protection) once you have locked your
# first golden test, so tampering is blocked regardless of who or what edited it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: build golden-lock
        run: go build -o gl .

      - name: verify locked files
        run: |
          if [ -f golden-lock/golden.lock ]; then
            ./gl verify
          else
            echo "no golden-lock/golden.lock present yet — nothing is locked; skipping."
            echo "this gate activates automatically once you run 'sudo golden-lock lock <file>'."
          fi
